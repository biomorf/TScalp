name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'dev'
      - 'release/**'
      - 'hotfix/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - 'dev'
      - 'master'
      - 'release/**'
      - 'hotfix/**'

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  fast-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run static analysis
        run: ./gradlew :app:ktlintMainSourceSetCheck :app:ktlintTestSourceSetCheck :app:lintDebug :app:detekt --continue

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-report
          path: app/build/reports/ktlint/

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: app/build/reports/detekt/

  fast-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Robolectric android-all
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: roborazzi-android-all-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            roborazzi-android-all-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/

  full-build:
    needs: fast-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Robolectric android-all
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: roborazzi-android-all-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            roborazzi-android-all-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate coverage report
        run: ./gradlew :app:koverXmlReportDebug :app:koverHtmlReportDebug

      - name: Verify coverage
        run: ./gradlew :app:koverVerifyDebug

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: app/build/reports/kover/

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
  gate:
      needs: [fast-static, fast-check, full-build]
      if: always()
      runs-on: ubuntu-latest
      steps:
          - name: Verify upstream jobs
            run: |
                if [ "${{ needs.fast-static.result }}" != "success" ]; then
                  echo "fast-static did not succeed: ${{ needs.fast-static.result }}"
                  exit 1
                fi
                if [ "${{ needs.fast-check.result }}" != "success" ]; then
                  echo "fast-check did not succeed: ${{ needs.fast-check.result }}"
                  exit 1
                fi
                if [ "${{ needs.full-build.result }}" != "success" ] \
                   && [ "${{ needs.full-build.result }}" != "skipped" ]; then
                  echo "full-build did not succeed and was not skipped: ${{ needs.full-build.result }}"
                  exit 1
                fi

  screenshot-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Robolectric android-all
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: roborazzi-android-all-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            roborazzi-android-all-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify Roborazzi screenshots
        run: ./gradlew :app:verifyRoborazziDebug

      - name: Upload Roborazzi results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-results
          path: |
            app/build/outputs/roborazzi/
            app/build/test-results/testDebugUnitTest/
