image: mobiledevops/android-sdk-image:36.1.0

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle
  - echo "sdk.dir=$ANDROID_HOME" > local.properties
  - chmod +x ./gradlew

cache:
    key: gradle-cache-v1
    paths:
      - .gradle/wrapper
      - .gradle/caches
      - .gradle/jdks

stages:
  - test
  - build
  - release

unit-tests:
  interruptible: true
  stage: test
  script:
    - ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  artifacts:
    when: always
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    paths:
      - app/build/reports/tests/testDebugUnitTest/
    expire_in: 1 week
  timeout: 30m

lint:
  interruptible: true
  stage: test
  script:
    - ./gradlew :app:lintDebug --no-daemon --stacktrace
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  artifacts:
    when: always
    paths:
      - app/build/reports/lint-results-debug.html
      - app/build/reports/lint-results-debug.xml
    expire_in: 1 week
  timeout: 30m

build-release:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --unshallow origin; fi
    - git fetch origin master
    - git merge-base --is-ancestor $CI_COMMIT_SHA origin/master || (echo "Tag is not on master branch, aborting" && exit 1)
    - echo "$KEYSTORE_BASE64" | base64 -d > $CI_PROJECT_DIR/tscalp-release.jks
    - |
      cat > keystore.properties <<EOF
      storeFile=$CI_PROJECT_DIR/tscalp-release.jks
      storePassword=$KEYSTORE_PASSWORD
      keyAlias=$KEY_ALIAS
      keyPassword=$KEY_PASSWORD
      EOF
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Building release $VERSION (versionCode computed from semver)"
    - ./gradlew :app:assembleRelease -PreleaseVersionName="$VERSION" --no-daemon --stacktrace
    - ls -la app/build/outputs/apk/release/
  artifacts:
    name: "tscalp-release-$CI_COMMIT_TAG"
    paths:
      - app/build/outputs/apk/release/tscalp-release-*.apk
    expire_in: 6 months
  timeout: 30m

publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - APK_FILE=$(ls app/build/outputs/apk/release/tscalp-release-*.apk | head -1)
    - APK_NAME=$(basename "$APK_FILE")
    - ARTIFACT_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_TAG}/raw/app/build/outputs/apk/release/${APK_NAME}?job=build-release"
    - echo "Publishing $APK_NAME → $ARTIFACT_URL"
    - |
      release-cli create \
        --name "Release $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "Релиз $CI_COMMIT_TAG. APK: $APK_NAME" \
        --assets-link "{\"name\":\"$APK_NAME\",\"url\":\"$ARTIFACT_URL\"}"
  timeout: 10m
  